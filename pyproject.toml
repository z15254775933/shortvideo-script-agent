[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortvideo-script-agent"
version = "0.2.0"
description = "A source-grounded short-video script agent for assessment question 4."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shortvideo-agent = "shortvideo_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
